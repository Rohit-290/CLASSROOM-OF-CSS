<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="Project.css">
</head>
<body>
    <header>
        <div class="navbar">
          <div class="nav-logo border">
          <div class="logo"></div> 
          </div> 


          <div class="nav-address border">
            <p class="add-first">Deliver to</p>
          <div class="add-icon">
            <i class="fa-solid fa-location-dot"></i>
            <p class="add-second"> India </p>
          </div>
          </div>                                                                                               



          <div class="nav-search">
            <select class="search-dropdown">
            <option class="search-dropdown">All</option>
            </select>
          <div class="search-input">
            <input class="search-input" type="text" placeholder="Search Amazon">
          </div>
          <div class="search-icon">
            <button class="search-icon">
            <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </div>
          </div>



          <div class="nav-lang border">
          <div class="flag-icon">
            <i class="fa-solid fa-flag-usa"></i>
               <p>EN</p>
          </div>
            <select class="lang">
            <option class="lang"> 
            <i class="fa-solid fa-caret-down"></i>
            </option>
            </select>
          </div>
         
          
          
          <div class="nav-accounts border">
            <span class="acc-first">Hello,sign in</span>
            <p class="acc-second">Accounts & Lists</p>
            <select class="acc-dropdown">
            <option>
            <i class="fa-solid fa-caret-down"></i>
            </option>
            </select>
          </div>



          <div class="nav-returns border">
            <span class="acc-first">Returns</span>
            <p class="acc-second">&Orders</p>
          </div>

          <div class="nav-cart border">
            <i class="fa-solid fa-cart-plus"></i>
             Cart
          </div>
         </div>
     

    </header>
</body>
</html>
